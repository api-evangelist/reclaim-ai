openapi: 3.2.0
info:
  title: Reclaim Accounts API
  description: Reclaim's awesome API
  contact:
    name: Reclaim.ai Inc.
    url: http://reclaim.ai
    email: info@reclaim.ai
  license:
    name: Reclaim 9.9
    url: http://reclaim.ai
  version: '0.1'
tags:
- name: Accounts
paths:
  /api/accounts:
    get:
      tags:
      - Accounts
      operationId: list
      responses:
        '200':
          description: list 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectedAccount'
      security:
      - Authorization: []
      summary: List
      x-summary-source: derived
  /api/accounts/calendars:
    get:
      tags:
      - Accounts
      operationId: getAllCalendars
      responses:
        '200':
          description: getAllCalendars 200 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/CalendarView'
      security:
      - Authorization: []
      summary: Get all calendars
      x-summary-source: derived
  /api/accounts/validate:
    post:
      tags:
      - Accounts
      operationId: validateAll
      responses:
        '200':
          description: validateAll 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Validate all
      x-summary-source: derived
  /api/accounts/{accountId}/calendars:
    get:
      tags:
      - Accounts
      operationId: getCalendars
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: getCalendars 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarView'
      security:
      - Authorization: []
      summary: Get calendars
      x-summary-source: derived
  /api/accounts/{accountId}/calendars/connected:
    put:
      tags:
      - Accounts
      operationId: setAvailability
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: setAvailability 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Set availability
      x-summary-source: derived
    post:
      tags:
      - Accounts
      operationId: postConnectedCalendar
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectedCalendarCreateRequest'
        required: true
      responses:
        '200':
          description: postConnectedCalendar 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarView'
      security:
      - Authorization: []
      summary: Post connected calendar
      x-summary-source: derived
  /api/accounts/{accountId}/calendars/connected/{calendarId}:
    get:
      tags:
      - Accounts
      operationId: getConnectedCalendar
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: calendarId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: getConnectedCalendar 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarView'
      security:
      - Authorization: []
      summary: Get connected calendar
      x-summary-source: derived
    put:
      tags:
      - Accounts
      operationId: putConnectedCalendar
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: calendarId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  $ref: '#/components/schemas/ConnectedCalendarUpdateRequest'
        required: true
      responses:
        '200':
          description: putConnectedCalendar 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarView'
      security:
      - Authorization: []
      summary: Put connected calendar
      x-summary-source: derived
    delete:
      tags:
      - Accounts
      operationId: deleteConnectedCalendar
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: calendarId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: deleteConnectedCalendar 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Delete connected calendar
      x-summary-source: derived
  /api/accounts/{accountId}/main:
    post:
      tags:
      - Accounts
      operationId: switchMain
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: switchMain 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Switch main
      x-summary-source: derived
  /api/accounts/{id}:
    delete:
      tags:
      - Accounts
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: delete 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Delete
      x-summary-source: derived
  /api/accounts/{id}/validate:
    post:
      tags:
      - Accounts
      operationId: validate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: validate 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
      summary: Validate
      x-summary-source: derived
components:
  schemas:
    ImmutableCollection_CalendarView_:
      type: object
      allOf:
      - $ref: '#/components/schemas/AbstractCollection_CalendarView_'
      - properties:
          empty:
            type: boolean
          partialView:
            type: boolean
    CapabilityInfo:
      required:
      - status
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CapabilityStatus'
        oauthURI:
          type:
          - string
          - 'null'
          format: uri
    AbstractCollection_CalendarView_:
      type: object
      properties:
        empty:
          type: boolean
    DirectoryAccess:
      required:
      - enabled
      - oauthURI
      type: object
      properties:
        enabled:
          type: boolean
        oauthURI:
          type: string
          format: uri
    ReclaimEventType:
      type: string
      enum:
      - USER
      - SYNC
      - HABIT_ASSIGNMENT
      - SMART_HABIT
      - ONE_ON_ONE_ASSIGNMENT
      - SMART_MEETING
      - TASK_ASSIGNMENT
      - CONF_BUFFER
      - TRAVEL_BUFFER
      - SCHEDULING_LINK_MEETING
      - UNKNOWN
      - FOCUS
    ConnectedCalendarCreateRequest:
      required:
      - externalId
      - useType
      type: object
      properties:
        externalId:
          type: string
        useType:
          $ref: '#/components/schemas/CalendarUseType'
    CalendarView:
      required:
      - colorHex
      - connected
      - credentialId
      - externalId
      - googleMeetAllowed
      - id
      - microsoftTeamsAllowed
      - name
      - otherConnectedCalendarsExist
      - provider
      - useType
      - writableFor
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
          format: int64
        externalId:
          type: string
        connected:
          type: boolean
        colorHex:
          type: string
        credentialId:
          type: integer
          format: int64
        reason:
          allOf:
          - $ref: '#/components/schemas/IneligibilityReason'
        writableFor:
          type: array
          items:
            $ref: '#/components/schemas/ReclaimEventType'
        provider:
          type: string
        googleMeetAllowed:
          type: boolean
        microsoftTeamsAllowed:
          type: boolean
        defaultReminders:
          type:
          - array
          - 'null'
          deprecated: true
          items:
            type: integer
            format: int32
        reminderDefaults:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Reminder'
        useType:
          $ref: '#/components/schemas/CalendarUseType'
        otherConnectedCalendarsExist:
          type: boolean
        accessDomainRead:
          type:
          - boolean
          - 'null'
    IneligibilityReason:
      type: string
      enum:
      - MAIN_ACCOUNT_PRIMARY
      - SYNCED_ALREADY
      - FREE_BUSY_ONLY
    CalendarUseType:
      type: string
      enum:
      - UNKNOWN
      - MULTI_USE
      - WORK
      - PERSONAL
      - FAMILY
      - TEAM
      - VACATION
      - TRAVEL
      - TEAM_OOO_CALENDAR
    ConnectedCalendarUpdateRequest:
      required:
      - useType
      type: object
      properties:
        useType:
          $ref: '#/components/schemas/CalendarUseType'
    ReminderType:
      type: string
      enum:
      - UI_NOTIFICATION
      - EMAIL
    CapabilityStatus:
      type: string
      enum:
      - GRANTED
      - PARTIAL
      - NOT_GRANTED
    CalendarAccess:
      type: string
      enum:
      - NONE
      - SETTINGS_ONLY
      - READ
      - WRITE
      - SUPER
    SharedCalendarsAccess:
      required:
      - enabled
      - oauthURI
      type: object
      properties:
        enabled:
          type: boolean
        oauthURI:
          type: string
          format: uri
    ConnectedAccountType:
      type: string
      enum:
      - GOOGLE
      - MICROSOFT
    ImmutableSet_CalendarView_:
      type: object
      allOf:
      - $ref: '#/components/schemas/ImmutableCollection_CalendarView_'
      - $ref: '#/components/schemas/AbstractCollection_CalendarView_'
      - properties:
          empty:
            type: boolean
          hashCodeFast:
            type: boolean
    Reminder:
      required:
      - minutes
      - reminderType
      type: object
      properties:
        reminderType:
          $ref: '#/components/schemas/ReminderType'
        minutes:
          type: integer
          format: int32
    ContactsAccess:
      required:
      - enabled
      - oauthURI
      type: object
      properties:
        enabled:
          type: boolean
        oauthURI:
          type: string
          format: uri
    ConnectedAccount:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        valid:
          type: boolean
        avatar:
          type:
          - string
          - 'null'
          format: uri
        main:
          type: boolean
        primaryCalendarId:
          type:
          - integer
          - 'null'
          format: int64
        canDelete:
          type: boolean
        type:
          $ref: '#/components/schemas/ConnectedAccountType'
        identityAccess:
          type: boolean
        calendarAccess:
          $ref: '#/components/schemas/CalendarAccess'
        taskAccess:
          type: boolean
        unique:
          type: boolean
        lastSynced:
          type:
          - string
          - 'null'
          format: date-time
        switchToMainURI:
          type:
          - string
          - 'null'
          format: uri
        canSwitchToMain:
          type: boolean
        noSwitchToMainReason:
          type: string
        existingPrimaryUserId:
          type:
          - string
          - 'null'
        repairURI:
          type:
          - string
          - 'null'
          format: uri
        connectedCalendars:
          $ref: '#/components/schemas/ImmutableSet_CalendarView_'
        numSyncedCalendars:
          type: integer
          format: int32
        userName:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        scopes:
          type: string
        contactsAccess:
          allOf:
          - $ref: '#/components/schemas/ContactsAccess'
        directoryAccess:
          allOf:
          - $ref: '#/components/schemas/DirectoryAccess'
        sharedCalendarsAccess:
          allOf:
          - $ref: '#/components/schemas/SharedCalendarsAccess'
        canRecolorEvents:
          type: boolean
        noRecolorEventsReason:
          type:
          - string
          - 'null'
        capabilities:
          properties:
            IDENTITY:
              $ref: '#/components/schemas/CapabilityInfo'
            AVAILABILITY:
              $ref: '#/components/schemas/CapabilityInfo'
            READ_EVENTS:
              $ref: '#/components/schemas/CapabilityInfo'
            WRITE_EVENTS:
              $ref: '#/components/schemas/CapabilityInfo'
            CALENDAR_ACCESS:
              $ref: '#/components/schemas/CapabilityInfo'
            PEOPLE_SUGGESTIONS:
              $ref: '#/components/schemas/CapabilityInfo'
            ROOMS_RESOURCES:
              $ref: '#/components/schemas/CapabilityInfo'
            SETTINGS:
              $ref: '#/components/schemas/CapabilityInfo'
            OUT_OF_OFFICE_SYNC:
              $ref: '#/components/schemas/CapabilityInfo'
            TASKS:
              $ref: '#/components/schemas/CapabilityInfo'
            ZOOM_MEETING_CREATION:
              $ref: '#/components/schemas/CapabilityInfo'
            ZOOM_PRESENCE_DETECTION:
              $ref: '#/components/schemas/CapabilityInfo'
            ZOOM_MEETING_ASSET_RETRIEVAL:
              $ref: '#/components/schemas/CapabilityInfo'
        withId:
          type: integer
          format: int64
        withName:
          type: string
        withValid:
          type: boolean
        withAvatar:
          type:
          - string
          - 'null'
          format: uri
        withMain:
          type: boolean
        withPrimaryCalendarId:
          type: integer
          format: int64
        withCanDelete:
          type: boolean
        withType:
          $ref: '#/components/schemas/ConnectedAccountType'
        withIdentityAccess:
          type: boolean
        withCalendarAccess:
          $ref: '#/components/schemas/CalendarAccess'
        withTaskAccess:
          type: boolean
        withUnique:
          type: boolean
        withLastSynced:
          type:
          - string
          - 'null'
          format: date-time
        withSwitchToMainURI:
          type:
          - string
          - 'null'
          format: uri
        withCanSwitchToMain:
          type: boolean
        withNoSwitchToMainReason:
          type: string
        withExistingPrimaryUserId:
          type:
          - string
          - 'null'
        withRepairURI:
          type:
          - string
          - 'null'
          format: uri
        withConnectedCalendars:
          type: array
          items:
            $ref: '#/components/schemas/CalendarView'
        withNumSyncedCalendars:
          type: integer
          format: int32
        withUserName:
          type:
          - string
          - 'null'
        withFirstName:
          type:
          - string
          - 'null'
        withLastName:
          type:
          - string
          - 'null'
        withScopes:
          type: string
        withContactsAccess:
          allOf:
          - $ref: '#/components/schemas/ContactsAccess'
        withDirectoryAccess:
          allOf:
          - $ref: '#/components/schemas/DirectoryAccess'
        withSharedCalendarsAccess:
          allOf:
          - $ref: '#/components/schemas/SharedCalendarsAccess'
        withCanRecolorEvents:
          type: boolean
        withNoRecolorEventsReason:
          type:
          - string
          - 'null'
        withCapabilities:
          properties:
            IDENTITY:
              $ref: '#/components/schemas/CapabilityInfo'
            AVAILABILITY:
              $ref: '#/components/schemas/CapabilityInfo'
            READ_EVENTS:
              $ref: '#/components/schemas/CapabilityInfo'
            WRITE_EVENTS:
              $ref: '#/components/schemas/CapabilityInfo'
            CALENDAR_ACCESS:
              $ref: '#/components/schemas/CapabilityInfo'
            PEOPLE_SUGGESTIONS:
              $ref: '#/components/schemas/CapabilityInfo'
            ROOMS_RESOURCES:
              $ref: '#/components/schemas/CapabilityInfo'
            SETTINGS:
              $ref: '#/components/schemas/CapabilityInfo'
            OUT_OF_OFFICE_SYNC:
              $ref: '#/components/schemas/CapabilityInfo'
            TASKS:
              $ref: '#/components/schemas/CapabilityInfo'
            ZOOM_MEETING_CREATION:
              $ref: '#/components/schemas/CapabilityInfo'
            ZOOM_PRESENCE_DETECTION:
              $ref: '#/components/schemas/CapabilityInfo'
            ZOOM_MEETING_ASSET_RETRIEVAL:
              $ref: '#/components/schemas/CapabilityInfo'
        equals: {}
        hashCode:
          type: integer
          format: int32
        toString:
          type: string
  securitySchemes:
    Authorization:
      type: oauth2
