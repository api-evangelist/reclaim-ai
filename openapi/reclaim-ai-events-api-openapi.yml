components:
  schemas:
    Colorized:
      type: object
      properties:
        color:
          $ref: '#/components/schemas/EventColor'
    ReclaimRecurrence:
      required:
      - frequency
      type: object
      properties:
        interval:
          type: integer
          description: 'Repeat interval: 1 means every, 2 means every other, 3 means every 3rd. Defaults to 1.'
          format: int32
        frequency:
          description: 'How often the event recurs: DAILY, WEEKLY, MONTHLY, or YEARLY'
          allOf:
          - $ref: '#/components/schemas/RecurrenceFrequency'
        days:
          type: array
          description: Days of the week for WEEKLY frequency (e.g. MONDAY, WEDNESDAY, FRIDAY)
          items:
            $ref: '#/components/schemas/DayOfWeek'
        monthlyDay:
          description: Day of the month for MONTHLY frequency
          allOf:
          - $ref: '#/components/schemas/MonthlyDay'
        yearlyDay:
          description: Day of the year for YEARLY frequency
          allOf:
          - $ref: '#/components/schemas/YearlyDay'
        until:
          type: string
          description: When the recurrence ends (yyyy-MM-ddTHH:mm:ssZ format, e.g. 2026-06-30T23:59:59Z). Mutually exclusive with count. Omit for no end date.
          format: date-time
        count:
          type: integer
          description: Total number of occurrences. Mutually exclusive with until. Omit for no end date.
          format: int32
        valid:
          type: boolean
      description: 'Recurrence pattern for a recurring event.

        - frequency is always required

        - For WEEKLY: days is required (which days of the week)

        - For MONTHLY: monthlyDay is required (which day of the month)

        - For YEARLY: yearlyDay is required (which day of the year)

        - interval defaults to 1 (every occurrence)

        - Optionally set count or until to limit occurrences'
    EventAssociationDetailsView:
      required:
      - canLock
      - canUnlock
      - locked
      - policyAssociations
      type: object
      properties:
        locked:
          type: boolean
        canLock:
          type: boolean
        canUnlock:
          type: boolean
        policyAssociations:
          type: array
          items:
            $ref: '#/components/schemas/PolicyAssociation'
        readOnlyReason:
          allOf:
          - $ref: '#/components/schemas/EventReadOnlyReason'
    EventSubType:
      type: string
      enum:
      - ONE_ON_ONE
      - STAFF_MEETING
      - OP_REVIEW
      - EXTERNAL
      - IDEATION
      - FOCUS
      - PRODUCTIVITY
      - TRAVEL
      - FLIGHT
      - TRAIN
      - RECLAIM
      - VACATION
      - HEALTH
      - ERRAND
      - OTHER_PERSONAL
      - UNKNOWN
    RecurrenceInstanceSummaryView:
      required:
      - end
      - isEstimate
      - start
      type: object
      properties:
        eventKey:
          allOf:
          - $ref: '#/components/schemas/EventKey'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        isEstimate:
          type: boolean
    MoreEntryPoint:
      required:
      - uri
      type: object
      properties:
        uri:
          type: string
        label:
          type:
          - string
          - 'null'
        pin:
          type:
          - string
          - 'null'
        type:
          type: string
    FocusTimeEventData:
      required:
      - policyId
      type: object
      properties:
        policyId:
          type: string
          format: uuid
    Month:
      type: string
      enum:
      - JANUARY
      - FEBRUARY
      - MARCH
      - APRIL
      - MAY
      - JUNE
      - JULY
      - AUGUST
      - SEPTEMBER
      - OCTOBER
      - NOVEMBER
      - DECEMBER
    EventDateRange:
