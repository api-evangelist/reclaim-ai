openapi: 3.2.0
info:
  title: Reclaim Schedule Policy API
  description: Reclaim's awesome API
  contact:
    name: Reclaim.ai Inc.
    url: http://reclaim.ai
    email: info@reclaim.ai
  license:
    name: Reclaim 9.9
    url: http://reclaim.ai
  version: '0.1'
tags:
- name: schedule-policy
paths:
  /api/schedule-policy:
    get:
      tags:
      - schedule-policy
      operationId: listPolicies
      responses:
        '200':
          description: listPolicies 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindSchedulePoliciesResponse'
      security:
      - Authorization: []
      summary: List policies
      x-summary-source: derived
  /api/schedule-policy/available-types:
    get:
      tags:
      - schedule-policy
      operationId: availablePolicyTypes
      responses:
        '200':
          description: availablePolicyTypes 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailablePolicyTypesResponse'
      security:
      - Authorization: []
      summary: Available policy types
      x-summary-source: derived
  /api/schedule-policy/create-default-policies:
    get:
      tags:
      - schedule-policy
      operationId: createDefaultPolicies
      responses:
        '200':
          description: createDefaultPolicies 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindSchedulePoliciesResponse'
      security:
      - Authorization: []
      summary: Create default policies
      x-summary-source: derived
  /api/schedule-policy/event-matcher-tags:
    get:
      tags:
      - schedule-policy
      operationId: getEventMatcherTags
      responses:
        '200':
          description: getEventMatcherTags 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMatcherTag'
      security:
      - Authorization: []
      summary: Get event matcher tags
      x-summary-source: derived
  /api/schedule-policy/matching-events:
    post:
      tags:
      - schedule-policy
      operationId: findMatchingEvents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingEventsRequest'
        required: true
      responses:
        '200':
          description: findMatchingEvents 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingEventsResponse'
      security:
      - Authorization: []
      summary: Find matching events
      x-summary-source: derived
  /api/schedule-policy/recommended:
    post:
      tags:
      - schedule-policy
      operationId: recommendedPolicies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendedPoliciesRequest'
        required: true
      responses:
        '200':
          description: recommendedPolicies 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendedPoliciesResponse'
      security:
      - Authorization: []
      summary: Recommended policies
      x-summary-source: derived
  /api/schedule-policy/smart-meeting/candidates:
    get:
      tags:
      - schedule-policy
      operationId: findSmartMeetingCandidates
      responses:
        '200':
          description: findSmartMeetingCandidates 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartMeetingCandidatesResponse'
      security:
      - Authorization: []
      summary: Find smart meeting candidates
      x-summary-source: derived
  /api/schedule-policy/templates:
    get:
      tags:
      - schedule-policy
      operationId: findTemplates
      responses:
        '200':
          description: findTemplates 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindTemplatesResponse'
      security:
      - Authorization: []
      summary: Find templates
      x-summary-source: derived
  /api/schedule-policy/templates/instantiate-meeting-quality:
    post:
      tags:
      - schedule-policy
      operationId: instantiateMeetingQualityPolicies
      parameters:
      - name: templateIds
        in: query
        required: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PolicyTemplateId'
      responses:
        '200':
          description: instantiateMeetingQualityPolicies 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindSchedulePoliciesResponse'
      security:
      - Authorization: []
      summary: Instantiate meeting quality policies
      x-summary-source: derived
  /api/schedule-policy/templates/instantiated/{templateId}:
    get:
      tags:
      - schedule-policy
      operationId: instantiateTemplate
      parameters:
      - name: templateId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PolicyTemplateId'
      responses:
        '200':
          description: instantiateTemplate 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantiateTemplatesResponse'
      security:
      - Authorization: []
      summary: Instantiate template
      x-summary-source: derived
  /api/schedule-policy/{policyId}:
    get:
      tags:
      - schedule-policy
      operationId: findPolicy
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: findPolicy 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindSchedulePoliciesResponse'
      security:
      - Authorization: []
      summary: Find policy
      x-summary-source: derived
  /api/schedule-policy/{policyId}/events:
    get:
      tags:
      - schedule-policy
      operationId: findUpcomingPolicyEvents
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: string
      - name: numUpcoming
        in: query
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: lookaheadDays
        in: query
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: scopeId
        in: query
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: findUpcomingPolicyEvents 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingPolicyEventsResponse'
      security:
      - Authorization: []
      summary: Find upcoming policy events
      x-summary-source: derived
components:
  schemas:
    EntryColor:
      type: string
      enum:
      - NONE
      - LAVENDER
      - SAGE
      - GRAPE
      - FLAMINGO
      - BANANA
      - TANGERINE
      - PEACOCK
      - GRAPHITE
      - BLUEBERRY
      - BASIL
      - TOMATO
    EventConflictPolicyTemplate:
      required:
      - category
      - description
      - icon
      - templateId
      - title
      type: object
      properties:
        templateId:
          $ref: '#/components/schemas/PolicyTemplateId'
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        category:
          $ref: '#/components/schemas/PolicyTemplateCategory'
        type:
          type: string
    MoreEntryPoint:
      required:
      - uri
      type: object
      properties:
        uri:
          type: string
        label:
          type:
          - string
          - 'null'
        pin:
          type:
          - string
          - 'null'
        type:
          type: string
    SchedulePolicyCommonDataPatchRequestFields:
      type: object
      properties:
        automationType:
          $ref: '#/components/schemas/AutomationType'
        status:
          $ref: '#/components/schemas/PolicyStatus'
        title:
          type: string
        description:
          type: string
    ShieldsUpEventData:
      required:
      - policyId
      type: object
      properties:
        policyId:
          type: string
          format: uuid
    LacksRsvpPolicy:
      required:
      - commonData
      - eventMatcher
      - eventMatcherTags
      type: object
      properties:
        commonData:
          $ref: '#/components/schemas/SchedulePolicyCommonData'
        eventMatcher:
          $ref: '#/components/schemas/EventMatcher'
        eventMatcherTags:
          $ref: '#/components/schemas/EventMatcherTags'
        type:
          type: string
    ShieldsUpEventData_1:
      required:
      - policyId
      type: object
      properties:
        policyId:
          $ref: '#/components/schemas/SchedulePolicyId'
    EventResourceParticipant:
      required:
      - email
      type: object
      properties:
        displayName:
          type:
          - string
          - 'null'
        email:
          type: string
        capacity:
          type:
          - integer
          - 'null'
          format: int32
        buildingId:
          type:
          - string
          - 'null'
        buildingName:
          type:
          - string
          - 'null'
        buildingDescription:
          type:
          - string
          - 'null'
        floorName:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        type:
          type: string
    DescriptionEventMatcher:
      required:
      - operator
      - predicateValue
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/EventMatcherOperator'
        predicateValue:
          type: string
        type:
          type: string
      description: Matches by event description text
    AnyEventMatcher:
      required:
      - matchers
      type: object
      properties:
        matchers:
          type: array
          items:
            $ref: '#/components/schemas/EventMatcher'
        type:
          type: string
      description: Matches if ANY matcher in the list matches
    FocusId:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
    GtdTaskLink:
      required:
      - url
      type: object
      properties:
        url:
          type: string
    ManualEditEventAction:
      required:
      - eventKey
      - policyId
      type: object
      properties:
        hash:
          type:
          - string
          - 'null'
        policyId:
          type: string
          format: uuid
        eventKey:
          $ref: '#/components/schemas/EventKey'
        type:
          type: string
    AvailablePolicyTypesResponse:
      required:
      - availableTypes
      type: object
      properties:
        availableTypes:
          type: array
          items:
            $ref: '#/components/schemas/SchedulePolicyType'
    RecurrenceFrequency:
      type: string
      enum:
      - DAILY
      - WEEKLY
      - MONTHLY
      - YEARLY
    HabitPolicy:
      required:
      - commonData
      - eventMatcher
      - minDurationMinutes
      - suppressWarnings
      - timePolicy
      type: object
      properties:
        commonData:
          $ref: '#/components/schemas/SchedulePolicyCommonData'
        eventMatcher:
          $ref: '#/components/schemas/EventMatcher'
        idealDurationMinutes:
          type:
          - integer
          - 'null'
          format: int64
        minDurationMinutes:
          type: integer
          format: int64
        availableTimeForTransparencyChangeMinutes:
          type:
          - integer
          - 'null'
          format: int64
        availableSlotsForTransparencyChange:
          type:
          - integer
          - 'null'
          format: int64
        autoBusyBeforeStartMinutes:
          type:
          - integer
          - 'null'
          format: int64
        timePolicy:
          $ref: '#/components/schemas/SchedulePolicyTimePolicy'
        proactivelyUseIdealTime:
          type:
          - boolean
          - 'null'
        noAvailabilityAction:
          allOf:
          - $ref: '#/components/schemas/ManagedEventNoAvailabilityAction'
        suppressWarnings:
          type: boolean
        type:
          type: string
    GtdLinearTaskForCreate:
      required:
      - sourceType
      - title
      type: object
      properties:
        sourceType:
          $ref: '#/components/schemas/GtdTaskId.TaskSourceType'
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        due:
          type:
          - string
          - 'null'
          format: date-time
        start:
          type:
          - string
          - 'null'
          format: date-time
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityLevel'
        estimateMinutes:
          type:
          - integer
          - 'null'
          format: int32
        teamId:
          type:
          - string
          - 'null'
        projectId:
          type:
          - string
          - 'null'
        assigneeId:
          type:
          - string
          - 'null'
        stateId:
          type:
          - string
          - 'null'
        labels:
          type:
          - array
          - 'null'
          items:
            type: string
        type:
          type: string
    FalseEventMatcher:
      type: object
      description: Never matches any event
    EventCategoryEventMatcher:
      required:
      - operator
      - predicateValue
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/EventMatcherOperator'
        predicateValue:
          $ref: '#/components/schemas/EventCategory'
        type:
          type: string
      description: Matches by event category
    ShieldsUpPatchRequestFields:
      type: object
      properties:
        commonData:
          $ref: '#/components/schemas/SchedulePolicyCommonDataPatchRequestFields'
        calendarId:
          type: integer
          format: int64
        eventTitle:
          type: string
        maxMeetingMinutesPerWeek:
          type: integer
          format: int32
        maxMeetingMinutesPerDay:
          type: integer
          format: int32
        thresholdType:
          $ref: '#/components/schemas/ShieldsUpThresholdType'
        minDurationMinutes:
          type:
          - integer
          - 'null'
          format: int32
        eventDescription:
          type:
          - string
          - 'null'
        eventVisibility:
          allOf:
          - $ref: '#/components/schemas/Visibility'
        eventReminders:
          allOf:
          - $ref: '#/components/schemas/Reminders'
        eventTransparency:
          allOf:
          - $ref: '#/components/schemas/Transparency'
        autoDeclineMode:
          allOf:
          - $ref: '#/components/schemas/AutoDeclineModeView'
        autoDeclineMessage:
          type:
          - string
          - 'null'
        eventCategory:
          allOf:
          - $ref: '#/components/schemas/EventCategory'
        eventPriority:
          allOf:
          - $ref: '#/components/schemas/PriorityLevel'
        eventColor:
          allOf:
          - $ref: '#/components/schemas/EntryColor'
        timePolicy:
          allOf:
          - $ref: '#/components/schemas/SchedulePolicyTimePolicy'
        type:
          type: string
    SelfRSVPMatcher:
      required:
      - operator
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/EventMatcherOperator'
        predicateValue:
          allOf:
          - $ref: '#/components/schemas/ResponseStatus'
        predicateValues:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ResponseStatus'
        type:
          type: string
      description: Matches by the user's own RSVP status
    OrEventMatcher:
      required:
      - left
      - right
      type: object
      properties:
        left:
          $ref: '#/components/schemas/EventMatcher'
        right:
          $ref: '#/components/schemas/EventMatcher'
        type:
          type: string
      description: Matches if either the left or right matcher matches
    ReclaimTask:
      required:
      - completed
      - extendedProperties
      - id
      - title
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityLevel'
        status:
          type:
          - string
          - 'null'
        link:
          allOf:
          - $ref: '#/components/schemas/GtdTaskLink'
        due:
          type:
          - string
          - 'null'
          format: date-time
        start:
          type:
          - string
          - 'null'
          format: date-time
        completed:
          type: boolean
        estimateMinutes:
          type:
          - integer
          - 'null'
          format: int32
        extendedProperties:
          type: object
          additionalProperties: true
        type:
          type: string
    TimeWindowEventMatcher.TimeWindowMatchMode:
      type: string
      enum:
      - STARTS_WITHIN
      - ENDS_WITHIN
      - STARTS_OR_ENDS_WITHIN
      - CONTAINED_WITHIN
      - OVERLAPS
    ManagedEventData_1:
      type: object
      properties:
        originalDuration:
          type:
          - string
          - 'null'
        linkedSuccessorExternalId:
          type:
          - string
          - 'null'
    ReclaimEventType:
      type: string
      enum:
      - USER
      - SYNC
      - HABIT_ASSIGNMENT
      - SMART_HABIT
      - ONE_ON_ONE_ASSIGNMENT
      - SMART_MEETING
      - TASK_ASSIGNMENT
      - CONF_BUFFER
      - TRAVEL_BUFFER
      - SCHEDULING_LINK_MEETING
      - UNKNOWN
      - FOCUS
    SmartMeetingPatchRequestFields:
      type: object
      properties:
        commonData:
          $ref: '#/components/schemas/SchedulePolicyCommonDataPatchRequestFields'
        eventMatcher:
          allOf:
          - $ref: '#/components/schemas/EventMatcher'
        idealDurationMinutes:
          type:
          - integer
          - 'null'
          format: int64
        minDurationMinutes:
          type: integer
          format: int64
        timePolicy:
          allOf:
          - $ref: '#/components/schemas/SchedulePolicyTimePolicy'
        suppressWarnings:
          type: boolean
        rescheduleHourSource:
          $ref: '#/components/schemas/RescheduleHourSource'
        type:
          type: string
    AddFocusEventAction:
      required:
      - end
      - eventKey
      - policyId
      - start
      - title
      type: object
      properties:
        hash:
          type:
          - string
          - 'null'
        policyId:
          type: string
          format: uuid
        eventKey:
          $ref: '#/components/schemas/EventKey'
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        description:
          type:
          - string
          - 'null'
        visibility:
          allOf:
          - $ref: '#/components/schemas/Visibility'
        transparency:
          allOf:
          - $ref: '#/components/schemas/Transparency'
        reminders:
          allOf:
          - $ref: '#/components/schemas/Reminders'
        autoDeclineMode:
          allOf:
          - $ref: '#/components/schemas/AutoDeclineModeView'
        autoDeclineMessage:
          type:
          - string
          - 'null'
        eventCategory:
          allOf:
          - $ref: '#/components/schemas/EventCategory'
        eventColor:
          allOf:
          - $ref: '#/components/schemas/EntryColor'
        type:
          type: string
    GtdJiraTaskForCreate:
      required:
      - sourceType
      - title
      type: object
      properties:
        sourceType:
          $ref: '#/components/schemas/GtdTaskId.TaskSourceType'
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        due:
          type:
          - string
          - 'null'
          format: date-time
        start:
          type:
          - string
          - 'null'
          format: date-time
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityLevel'
        estimateMinutes:
          type:
          - integer
          - 'null'
          format: int32
        projectKey:
          type:
          - string
          - 'null'
        issueTypeId:
          type:
          - string
          - 'null'
        labels:
          type:
          - array
          - 'null'
          items:
            type: string
        assigneeId:
          type:
          - string
          - 'null'
        parentKey:
          type:
          - string
          - 'null'
        type:
          type: string
    CalendarEventField:
      type: string
      enum:
      - TITLE
      - DESCRIPTION
      - DATE_RANGE
      - ORIGINAL_START
      - STATUS
      - VISIBILITY
      - TRANSPARENCY
      - COLOR
      - ATTENDEES
      - LOCATION
      - REMINDERS
      - RECURRING_EVENT_ID
      - CONFERENCE_DATA
      - GUESTS_CAN_MODIFY
      - GUESTS_CAN_INVITE_OTHERS
      - GUESTS_CAN_SEE_OTHER_GUESTS
      - VERSION_DATA
    GtdTaskForCreate:
      type: object
      discriminator:
        propertyName: type
        mapping:
          GtdAsanaTaskForCreate: '#/components/schemas/GtdAsanaTaskForCreate'
          GtdTodoistTaskForCreate: '#/components/schemas/GtdTodoistTaskForCreate'
          GtdClickUpTaskForCreate: '#/components/schemas/GtdClickUpTaskForCreate'
          GtdGoogleTasksTaskForCreate: '#/components/schemas/GtdGoogleTasksTaskForCreate'
          GtdLinearTaskForCreate: '#/components/schemas/GtdLinearTaskForCreate'
          ReclaimTaskForCreate: '#/components/schemas/ReclaimTaskForCreate'
          GtdJiraTaskForCreate: '#/components/schemas/GtdJiraTaskForCreate'
          GtdNotionTaskForCreate: '#/components/schemas/GtdNotionTaskForCreate'
      oneOf:
      - $ref: '#/components/schemas/ReclaimTaskForCreate'
      - $ref: '#/components/schemas/GtdAsanaTaskForCreate'
      - $ref: '#/components/schemas/GtdClickUpTaskForCreate'
      - $ref: '#/components/schemas/GtdGoogleTasksTaskForCreate'
      - $ref: '#/components/schemas/GtdJiraTaskForCreate'
      - $ref: '#/components/schemas/GtdLinearTaskForCreate'
      - $ref: '#/components/schemas/GtdNotionTaskForCreate'
      - $ref: '#/components/schemas/GtdTodoistTaskForCreate'
    TrueAttendeeMatcher:
      type: object
      description: Always matches any attendee
    FocusTimePatchRequestFields:
      type: object
      properties:
        commonData:
          $ref: '#/components/schemas/SchedulePolicyCommonDataPatchRequestFields'
        calendarId:
          type: integer
          format: int64
        eventTitle:
          type: string
        weeklyGoalMinutes:
          type: integer
          format: int32
        idealDurationPerDayMinutes:
          type:
          - integer
          - 'null'
          format: int32
        maxDurationPerDayMinutes:
          type:
          - integer
          - 'null'
          format: int32
        minEventDurationMinutes:
          type:
          - integer
          - 'null'
          format: int32
        maxEventDurationMinutes:
          type:
          - integer
          - 'null'
          format: int32
        eventDescription:
          type:
          - string
          - 'null'
        eventVisibility:
          allOf:
          - $ref: '#/components/schemas/Visibility'
        eventReminders:
          allOf:
          - $ref: '#/components/schemas/Reminders'
        eventTransparency:
          allOf:
          - $ref: '#/components/schemas/Transparency'
        autoDeclineMode:
          allOf:
          - $ref: '#/components/schemas/AutoDeclineModeView'
        autoDeclineMessage:
          type:
          - string
          - 'null'
        eventCategory:
          allOf:
          - $ref: '#/components/schemas/EventCategory'
        eventPriority:
          allOf:
          - $ref: '#/components/schemas/PriorityLevel'
        eventColor:
          allOf:
          - $ref: '#/components/schemas/EntryColor'
        timePolicy:
          allOf:
          - $ref: '#/components/schemas/SchedulePolicyTimePolicy'
        type:
          type: string
    PolicySeriesView:
      required:
      - instances
      - root
      type: object
      properties:
        root:
          $ref: '#/components/schemas/CalendarEventV2'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEventV2'
    SchedulePolicyType:
      type: string
      enum:
      - AttendeeAvailabilityWarningPolicy
      - BasicEventWarningPolicy
      - BufferEventPolicy
      - EventConflictPolicy
      - FocusTimePolicy
      - HabitPolicy
      - LacksRsvpPolicy
      - LacksVideoConferencePolicy
      - ManagedEventSchedulingPolicy
      - ShieldsUpPolicy
      - SmartMeetingPolicy
      - UNKNOWN
      x-enum-varnames:
      - AttendeeAvailabilityWarningPolicy
      - BasicEventWarningPolicy
      - BufferEventPolicy
      - EventConflictPolicy
      - FocusTimePolicy
      - HabitPolicy
      - LacksRsvpPolicy
      - LacksVideoConferencePolicy
      - ManagedEventSchedulingPolicy
      - ShieldsUpPolicy
      - SmartMeetingPolicy
      - UNKNOWN
    LacksVideoConferenceCreateRequestFields:
      required:
      - commonData
      type: object
      properties:
        commonData:
          $ref: '#/components/schemas/SchedulePolicyCommonDataCreateRequestFields'
        eventMatcher:
          allOf:
          - $ref: '#/components/schemas/EventMatcher'
        eventMatcherTags:
          description: Predefined event matching tags. Either this or eventMatcher is required.
          allOf:
          - $ref: '#/components/schemas/EventMatcherTags'
        type:
          type: string
    FalseAttendeeMatcher:
      type: object
